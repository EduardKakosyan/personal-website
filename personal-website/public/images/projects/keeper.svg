<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How a meeting moves through Keeper</title><desc id="desc">On the Mac: record the call, transcribe it live with a speech model, transcribe it again after the call. On the server: store and index it, summarise it with an open-weights model, and serve it through one access rule to the web page, the API and MCP.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b5a45"/></marker></defs>
<rect width="880" height="470" rx="12" fill="#fbf6ea"/>
<rect x="24" y="24" width="392" height="380" rx="10" fill="none" stroke="#8a7a5a" stroke-width="1.2" stroke-dasharray="2 5"/><text x="38" y="46" fill="#8a7a5a" font-size="13" letter-spacing="1">ON EACH MAC</text>
<rect x="444" y="24" width="412" height="380" rx="10" fill="none" stroke="#8a7a5a" stroke-width="1.2" stroke-dasharray="2 5"/><text x="458" y="46" fill="#8a7a5a" font-size="13" letter-spacing="1">ON OUR OWN SERVER (DGX SPARK)</text>
<rect x="60" y="62" width="320" height="62" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="220.0" y="88.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Record the call</text>
<text x="220.0" y="107.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">microphone + what the Mac plays, no bot</text>
<rect x="60" y="164" width="320" height="62" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="220.0" y="190.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Live transcript</text>
<text x="220.0" y="209.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">streaming speech model, speakers numbered</text>
<rect x="60" y="266" width="320" height="62" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="220.0" y="292.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Transcribe again after the call</text>
<text x="220.0" y="311.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">slower, more accurate model</text>
<path d="M220.0 124.0 L220.0 164.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M220.0 226.0 L220.0 266.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<rect x="480" y="62" width="340" height="62" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="650.0" y="88.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Store and index</text>
<text x="650.0" y="107.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">one SQLite file, full-text search</text>
<rect x="480" y="164" width="340" height="62" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="650.0" y="190.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Summarise</text>
<text x="650.0" y="209.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">open-weights model, from a queue</text>
<rect x="480" y="266" width="340" height="62" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="650.0" y="292.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">One access rule</text>
<text x="650.0" y="311.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">a meeting belongs to who recorded it</text>
<path d="M650.0 124.0 L650.0 164.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M650.0 226.0 L650.0 266.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M380.0 297.0 L430.0 297.0 L430.0 93.0 L480.0 93.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="430.0" y="81.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">upload</text>
<rect x="480" y="346" width="340" height="50" rx="7" fill="none" stroke="#8a7a5a" stroke-width="1.5"/>
<text x="650.0" y="366.5" fill="#6b5a45" font-size="15" font-weight="700" text-anchor="middle">Web page · REST API · MCP</text>
<text x="650.0" y="385.5" fill="#6b5a45" font-size="13.5" text-anchor="middle">for people, and for Claude or ChatGPT</text>
<path d="M650.0 328.0 L650.0 346.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="#f2b880" stroke="#f2b880"/>
<text x="50" y="444" fill="#6b5a45" font-size="13">a model</text>
<rect x="119.80000000000001" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="none" stroke="#6b5a45"/>
<text x="145.8" y="444" fill="#6b5a45" font-size="13">plain code</text>
</svg>

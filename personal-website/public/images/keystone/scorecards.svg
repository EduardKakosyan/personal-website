<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Eight synthetic scorecard wireframes</title><desc id="desc">Placeholder cards for the eight views: leadership, strategy, capacity, delivery, finance, people, tech adoption and reusable IP. Empty rows; not the final interface or real metrics.</desc>
<defs><g id="card"><rect width="165" height="155" rx="6" fill="none" stroke="#c5c9bf"/><path d="M15 55h135M15 85h90M15 115h115" stroke="#c5c9bf" stroke-width="3"/></g></defs>
<rect width="800" height="500" rx="12" fill="#122b29"/>
<g><use href="#card" x="30" y="90"/><use href="#card" x="220" y="90"/><use href="#card" x="410" y="90"/><use href="#card" x="600" y="90"/><use href="#card" x="30" y="280"/><use href="#card" x="220" y="280"/><use href="#card" x="410" y="280"/><use href="#card" x="600" y="280"/></g>
<g fill="#f5eee2" font-family="sans-serif" font-size="20"><text x="45" y="125">Leadership</text><text x="235" y="125">Strategy</text><text x="425" y="125">Capacity</text><text x="615" y="125">Delivery</text><text x="45" y="315">Finance</text><text x="235" y="315">People</text><text x="425" y="315">Tech adoption</text><text x="615" y="315">Reusable IP</text></g>
<text x="30" y="43" fill="#f5eee2" font-family="monospace" font-size="16">SYNTHETIC / EIGHT VIEWS, PLACEHOLDER ROWS, NOT FINAL UI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How the website is built</title><desc id="desc">Python scripts build the 3D models, a plain TypeScript simulation runs the world and is covered by ordinary tests, and one file of facts feeds the site, the résumé PDF and the GitHub profile. A small model in the browser only picks from answers written ahead of time.</desc>

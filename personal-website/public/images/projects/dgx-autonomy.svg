<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">One run of dgx-autonomy</title><desc id="desc">The brief and tests are frozen. A local model builds in a sandbox and hands off to a fresh conversation when it fills up. When it says it is done, a controller runs the frozen tests from outside. A passing build waits for a person to accept it or send feedback.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b5a45"/></marker></defs>
<rect width="880" height="470" rx="12" fill="#fbf6ea"/>
<rect x="24" y="70" width="216" height="84" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="132.0" y="98.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Brief and tests</text>
<text x="132.0" y="117.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">frozen and fingerprinted</text>
<text x="132.0" y="136.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">before the build starts</text>
<rect x="286" y="70" width="250" height="84" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="411.0" y="98.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">The builder</text>
<text x="411.0" y="117.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">a local model in a sandbox:</text>
<text x="411.0" y="136.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">plans, codes, serves a demo</text>
<rect x="640" y="70" width="216" height="84" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="748.0" y="98.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">The controller</text>
<text x="748.0" y="117.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">snapshot, then every frozen</text>
<text x="748.0" y="136.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">test in its own container</text>
<path d="M240.0 112.0 L286.0 112.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M536.0 112.0 L640.0 112.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="588.0" y="102.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">says &quot;done&quot;</text>
<path d="M366.0 70.0 L366.0 36.0 L456.0 36.0 L456.0 70.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="411.0" y="26.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">handoff note → fresh conversation</text>
<rect x="640" y="250" width="216" height="84" rx="7" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-dasharray="7 5"/>
<text x="748.0" y="278.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Review</text>
<text x="748.0" y="297.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">a person opens the demo</text>
<text x="748.0" y="316.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">and decides</text>
<path d="M748.0 154.0 L748.0 250.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="776.0" y="208.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">pass</text>
<rect x="286" y="250" width="250" height="84" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="411.0" y="278.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Accepted</text>
<text x="411.0" y="297.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">the demo stays up, with</text>
<text x="411.0" y="316.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">a record of every claim</text>
<path d="M640.0 292.0 L536.0 292.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="588.0" y="282.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">accept</text>
<path d="M680.0 154.0 L680.0 200.0 L476.0 200.0 L476.0 154.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="578.0" y="192.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">fail: back with the failures</text>
<path d="M700.0 334.0 L700.0 374.0 L140.0 374.0 L140.0 200.0 L346.0 200.0 L346.0 154.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="420.0" y="366.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">feedback: what a user sees, never how to code it</text>
<rect x="24" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="#f2b880" stroke="#f2b880"/>
<text x="50" y="444" fill="#6b5a45" font-size="13">a model</text>
<rect x="119.80000000000001" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="none" stroke="#6b5a45"/>
<text x="145.8" y="444" fill="#6b5a45" font-size="13">plain code</text>
<rect x="237.8" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="none" stroke="#3b2a1e" stroke-dasharray="4 3"/>
<text x="263.8" y="444" fill="#6b5a45" font-size="13">a person</text>
</svg>

<text x="368.0" y="111.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">React Three Fiber, pixel look</text>
<rect x="508" y="62" width="180" height="70" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="598.0" y="92.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">The simulation</text>
<text x="598.0" y="111.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">plain TypeScript, no 3D</text>
<rect x="728" y="62" width="104" height="70" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="780.0" y="92.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Tests</text>
<text x="780.0" y="111.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">run it</text>

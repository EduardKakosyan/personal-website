<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How lyfe is put together</title><desc id="desc">The phone records what happened, even offline. A backend on a private network decides what counts with plain rules. Two models have narrow jobs: one estimates a meal from a photo and one draws meals and food icons.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b5a45"/></marker></defs>
<rect width="880" height="470" rx="12" fill="#fbf6ea"/>
<rect x="24" y="66" width="210" height="62" rx="7" fill="none" stroke="#8a7a5a" stroke-width="1.5"/>
<text x="129.0" y="92.5" fill="#6b5a45" font-size="15" font-weight="700" text-anchor="middle">Watch → Garmin</text>
<text x="129.0" y="111.5" fill="#6b5a45" font-size="13.5" text-anchor="middle">workouts</text>
<rect x="24" y="178" width="210" height="84" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="129.0" y="206.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">iPhone app</text>
<text x="129.0" y="225.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">records what happened,</text>
<text x="129.0" y="244.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">even offline</text>
<rect x="24" y="312" width="210" height="62" rx="7" fill="none" stroke="#8a7a5a" stroke-width="1.5"/>
<text x="129.0" y="338.5" fill="#6b5a45" font-size="15" font-weight="700" text-anchor="middle">Bank bridge</text>
<text x="129.0" y="357.5" fill="#6b5a45" font-size="13.5" text-anchor="middle">read-only</text>
<rect x="282" y="24" width="574" height="380" rx="10" fill="none" stroke="#8a7a5a" stroke-width="1.2" stroke-dasharray="2 5"/><text x="296" y="46" fill="#8a7a5a" font-size="13" letter-spacing="1">BACKEND ON A DGX SPARK · PRIVATE NETWORK ONLY</text>
<rect x="310" y="66" width="250" height="196" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="435.0" y="131.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">The rules</text>
<text x="435.0" y="150.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">what counts as a session,</text>
<text x="435.0" y="169.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">streaks and recovery,</text>
<text x="435.0" y="188.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">the next breath session,</text>
<text x="435.0" y="207.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">when to remind</text>
<rect x="310" y="312" width="250" height="62" rx="7" fill="none" stroke="#6b5a45" stroke-width="2"/>
<text x="435.0" y="338.5" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">PostgreSQL</text>
<text x="435.0" y="357.5" fill="#3b2a1e" font-size="13.5" text-anchor="middle">no network port</text>
<rect x="600" y="66" width="230" height="84" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="715.0" y="94.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Vision model</text>
<text x="715.0" y="113.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">estimates a meal from a photo,</text>
<text x="715.0" y="132.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">always marked as an estimate</text>
<rect x="600" y="178" width="230" height="84" rx="7" fill="#f2b880" stroke="#f2b880" stroke-width="2"/>
<text x="715.0" y="206.0" fill="#3b2a1e" font-size="15" font-weight="700" text-anchor="middle">Image model</text>
<text x="715.0" y="225.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">draws meals and icons,</text>
<text x="715.0" y="244.0" fill="#3b2a1e" font-size="13.5" text-anchor="middle">never touches a number</text>
<path d="M234.0 97.0 L310.0 97.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="129.0" y="148.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">checked every 15 min</text>
<path d="M234.0 220.0 L310.0 220.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M310.0 236.0 L234.0 236.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M234.0 343.0 L310.0 343.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<text x="129.0" y="394.0" fill="#6b5a45" font-size="12.5" text-anchor="middle">four times a day</text>
<path d="M560.0 108.0 L600.0 108.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M560.0 220.0 L600.0 220.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<path d="M435.0 262.0 L435.0 312.0" fill="none" stroke="#6b5a45" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="#f2b880" stroke="#f2b880"/>
<text x="50" y="444" fill="#6b5a45" font-size="13">a model</text>
<rect x="119.80000000000001" y="433" width="18" height="13" rx="3" stroke-width="1.6" fill="none" stroke="#6b5a45"/>
<text x="145.8" y="444" fill="#6b5a45" font-size="13">plain code</text>
</svg>
